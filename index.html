<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<meta name="description" content="A collection of small browser tools. Each runs as a single page with no install.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column. Header, then a list of tool rows. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#151b26; --muted:#5a6575; --border:#d5dbe3; --accent:#2142c4;
  --font-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1319; --surface:#1b212b; --ink:#e7ebf1; --muted:#a0aab8; --border:#2e3745; --accent:#8ea4ff; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 32px;color:var(--muted)}
.tools{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tool a{display:grid;gap:4px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:inherit;text-decoration:none}
.tool a:hover{border-color:var(--accent)}
.tool a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool h2{margin:0;font-size:17px;color:var(--accent)}
.tool p{margin:0;color:var(--muted);font-size:14px}
.path{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Tools</h1>
  <p class="lead">Small tools that run in the browser. Nothing to install, and your data stays on your device.</p>
  <ul class="tools">
    <li class="tool">
      <a href="OrgchartBuilder/">
        <h2>Org Chart Builder</h2>
        <p>Put people into a reporting structure with names, roles and departments. Drag to arrange, paste a list, export to PNG, SVG or CSV.</p>
        <span class="path">OrgchartBuilder/</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
