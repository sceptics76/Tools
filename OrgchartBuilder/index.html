<style id="app-style">
/* Layout: full-height workspace. Toolbar on top, dotted canvas on the left, editor panel on the right (bottom sheet on phones). */
:root{
  --bg:#eef1f5; --canvas:#f7f8fa; --dot:#cdd4de; --surface:#ffffff; --surface-2:#f1f3f7;
  --ink:#151b26; --muted:#5a6575; --faint:#8a95a4; --line:#98a3b3; --border:#d5dbe3;
  --accent:#2142c4; --accent-ink:#ffffff; --accent-soft:#e3e8fa; --ring:rgba(33,66,196,.28);
  --danger:#b42318; --danger-soft:#fdeceb;
  --d0:#0f8a7e; --d1:#b26b12; --d2:#c03a68; --d3:#6a4fd0; --d4:#3d8a2a; --d5:#1d78b5;
  --shadow:0 1px 2px rgba(21,27,38,.06),0 2px 8px rgba(21,27,38,.06);
  --shadow-lg:0 10px 30px rgba(21,27,38,.18);
  --scrim:rgba(10,14,20,.45);
  --font-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}

  --bg:#0f1319; --canvas:#141922; --dot:#262e3b; --surface:#1b212b; --surface-2:#232b37;
  --ink:#e7ebf1; --muted:#a0aab8; --faint:#6f7a8a; --line:#5d6878; --border:#2e3745;
  --accent:#8ea4ff; --accent-ink:#0c1433; --accent-soft:#222b4a; --ring:rgba(142,164,255,.35);
  --danger:#ff8b7d; --danger-soft:#3a1c19;
  --d0:#3cc4b4; --d1:#e2a447; --d2:#f0789f; --d3:#a491ff; --d4:#79c463; --d5:#5cb3ec;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.22); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1319; --canvas:#141922; --dot:#262e3b; --surface:#1b212b; --surface-2:#232b37;
  --ink:#e7ebf1; --muted:#a0aab8; --faint:#6f7a8a; --line:#5d6878; --border:#2e3745;
  --accent:#8ea4ff; --accent-ink:#0c1433; --accent-soft:#222b4a; --ring:rgba(142,164,255,.35);
  --danger:#ff8b7d; --danger-soft:#3a1c19;
  --d0:#3cc4b4; --d1:#e2a447; --d2:#f0789f; --d3:#a491ff; --d4:#79c463; --d5:#5cb3ec;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.22); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px}
#root{height:100%;display:flex;flex-direction:column;min-height:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.bar-title{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.title-input{font-weight:700;font-size:19px;letter-spacing:-.01em;border:0;background:transparent;padding:3px 6px;margin-left:-6px;border-radius:6px;width:min(44ch,100%);min-width:0}
.title-input:hover{background:var(--surface-2)}
.title-input:focus{outline:2px solid var(--ring);background:var(--surface)}
.stats{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn,.icon{height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn{padding:0 12px}
.icon{width:34px;font-size:17px;line-height:1;display:inline-grid;place-items:center;padding:0}
.btn:hover:not(:disabled),.icon:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled,.icon:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.primary:disabled{background:transparent;border-color:var(--border);color:var(--muted);opacity:1}
.btn.small{height:30px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.group{display:inline-flex}
.group>*{border-radius:0}
.group>*+*{margin-left:-1px}
.group>:first-child{border-radius:8px 0 0 8px}
.group>:last-child{border-radius:0 8px 8px 0}
.group .btn.mono{min-width:62px;padding:0 8px}
.switch{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;padding:0 4px;user-select:none}
.switch input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:220px;z-index:30;display:grid}
.menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu button:hover:not(:disabled){background:var(--surface-2)}
.menu button:disabled{color:var(--faint);cursor:default}
.menu small{display:block;color:var(--muted);font-size:11.5px}

.notice{margin:12px 16px 0;padding:10px 14px;background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;font-size:13px;line-height:1.45}
.notice-actions{display:flex;gap:8px}

.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px 16px 16px}
.viewport{flex:1;min-width:0;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:20px 20px;touch-action:none;cursor:grab}
.viewport.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible}
.edges path{fill:none;stroke:var(--line);stroke-width:1.5}
.card{position:absolute;width:200px;height:92px;padding:11px 14px 9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;user-select:none;-webkit-user-select:none}
.card:hover{border-color:var(--line)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.card.drop-ok{outline:2px dashed var(--accent);outline-offset:3px;background:var(--accent-soft)}
.card.drop-before::before,.card.drop-after::before{content:"";position:absolute;background:var(--accent);border-radius:2px;top:4px;bottom:4px;width:4px}
.card.drop-before::before{left:-13px}
.card.drop-after::before{right:-13px}
.card.vert.drop-before::before,.card.vert.drop-after::before{left:4px;right:4px;width:auto;height:4px;top:auto;bottom:auto}
.card.vert.drop-before::before{top:-9px}
.card.vert.drop-after::before{bottom:-9px}
.drop-hint{position:fixed;z-index:51;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.card.dragging{opacity:.35}
.c-name{font-weight:700;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name.empty{color:var(--faint);font-weight:500;font-style:italic}
.c-role{font-size:12.5px;line-height:16px;color:var(--muted);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:18px}
.dept{font-size:11.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.kids{font-family:var(--font-mono);font-size:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 8px;cursor:pointer;flex:none;line-height:15px}
.kids:hover{color:var(--ink);border-color:var(--line)}
.kids.collapsed{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.95;transform:rotate(-1.5deg);box-shadow:var(--shadow-lg);margin:0}
.empty-canvas{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:16px}
.empty-canvas p{margin:0;color:var(--muted)}
.empty-canvas div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:calc(100% - 24px)}

.panel{width:300px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto}
.p-empty h2{font-size:15px;margin:0 0 8px}
.tips{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--muted);display:grid;gap:6px}
.tips b{color:var(--ink)}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2);color:var(--ink)}
.legend{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px}
.legend .eyebrow{width:100%;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-family:var(--font-mono);font-weight:500;color:var(--faint)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.p-form{display:grid;gap:12px}
.p-head{display:flex;justify-content:space-between;align-items:center}
.p-head .icon{border-color:transparent}
.field{display:grid;gap:5px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:14px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:2px solid var(--ring);border-color:var(--accent);background:var(--surface)}
.p-row{display:flex;gap:8px}
.p-row .btn{flex:1}
.p-row.wrap{flex-wrap:wrap}
.p-meta{margin:0;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.p-keys{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.confirm{background:var(--danger-soft);border:1px solid var(--border);border-radius:10px;padding:12px;display:grid;gap:10px}
.confirm p{margin:0;font-size:13px;line-height:1.45}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:min(660px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow-lg)}
.sheet h2{margin:0;font-size:18px;text-wrap:balance}
.sheet .sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.sheet textarea{min-height:230px;width:100%;font-family:var(--font-mono);font-size:13px;line-height:1.55;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:10px 12px;resize:vertical;tab-size:2}
.sheet textarea:focus{outline:2px solid var(--ring);border-color:var(--accent)}
.paste-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.modes{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.modes legend{font-size:12px;font-weight:600;color:var(--muted);padding:0;margin-bottom:4px;width:100%}
.modes label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.modes input{accent-color:var(--accent);margin:0}
.modes label.off{color:var(--faint);cursor:default}
.paste-count{font-size:12px;color:var(--muted)}
.end{justify-content:flex-end;flex-wrap:wrap}
.end .btn{flex:none}
.grow{flex:1}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .main{padding:8px 16px 16px}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:14px 14px 0 0;z-index:40;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;box-shadow:var(--shadow-lg)}
  .panel.open{display:block}
  .title-input{font-size:17px}
  .tools{gap:6px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

/* ---------- layout ---------- */
function layout(){
  var wm = {}, st = {}, pos = {}, paths = [];
  function vis(id){ return byId[id].collapsed ? [] : (kids[id] || []); }
  function meas(id){
    var c = vis(id);
    c.forEach(function(k){ meas(k.id); });
    if (!c.length) { wm[id] = W; return; }
    if (state.stack && c.length >= 3 && c.every(function(k){ return vis(k.id).length === 0; })) { st[id] = true; wm[id] = W + SI; return; }
    var s = 0; c.forEach(function(k, i){ s += wm[k.id] + (i ? GX : 0); });
    wm[id] = Math.max(W, s);
  }
  function place(id, x, y){
    var c = vis(id);
    if (!c.length) { pos[id] = { x: x, y: y }; return; }
    if (st[id]) {
      pos[id] = { x: x, y: y };
      var sx = x + SI / 2, cy = y + H + 20, lastMid = 0;
      c.forEach(function(k){ pos[k.id] = { x: x + SI, y: cy }; lastMid = cy + H / 2; paths.push("M" + sx + " " + lastMid + "H" + (x + SI)); cy += H + SG; });
      paths.push("M" + sx + " " + (y + H) + "V" + lastMid);
      return;
    }
    var s = 0; c.forEach(function(k, i){ s += wm[k.id] + (i ? GX : 0); });
    var cx = x + (wm[id] - s) / 2;
    c.forEach(function(k){ place(k.id, cx, y + H + GY); cx += wm[k.id] + GX; });
    var f = pos[c[0].id], l = pos[c[c.length - 1].id];
    var px = (f.x + l.x) / 2; pos[id] = { x: px, y: y };
    var pcx = px + W / 2, my = y + H + GY / 2;
    c.forEach(function(k){ var q = pos[k.id]; paths.push("M" + pcx + " " + (y + H) + "V" + my + "H" + (q.x + W / 2) + "V" + q.y); });
  }
  var x = 0;
  roots.forEach(function(r){ meas(r.id); place(r.id, x, 0); x += wm[r.id] + RG; });
  var w = 0, h = 0;
  Object.keys(pos).forEach(function(id){ w = Math.max(w, pos[id].x + W); h = Math.max(h, pos[id].y + H); });

function addPerson(parent, afterId){

  commit(function(){
    var p = { id: id, name: "", role: "", dept: dept, parent: parent || null, collapsed: false };
    if (afterId && byId[afterId]) state.people.splice(state.people.indexOf(byId[afterId]) + 1, 0, p);

/* ---------- pointer: select, drag to reparent, pan ---------- */
var ptr = null, ghost = null, dropTarget = null, dropZone = null, dropHint = null;
/* Find the card under the pointer, tolerating the gaps between cards, and which part of it:

function hitTest(clientX, clientY){

  var best = null, bestD = Infinity, padX = GX / 2 + 2, padY = 12;
  Object.keys(L.pos).forEach(function(id){
    var q = L.pos[id];
    if (sx < q.x - padX || sx > q.x + W + padX || sy < q.y - padY || sy > q.y + H + padY) return;
    var d = Math.abs(sx - (q.x + W / 2)) + Math.abs(sy - (q.y + H / 2));
    if (d < bestD) { bestD = d; best = id; }
  });
  if (!best) return null;
  var q = L.pos[best], p = byId[best];
  var vert = !!(p.parent && L.stacked[p.parent]);
